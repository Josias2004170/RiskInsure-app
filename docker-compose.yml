services:
  riskinsure-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riskinsure-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    networks:
      - riskinsure-network

networks:
  riskinsure-network:
    driver: bridge
